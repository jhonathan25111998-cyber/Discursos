<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Discursos Públicos - Samas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .btn-month { transition: all 0.2s ease; }
        .btn-month:hover { transform: scale(1.05); }
        .loading { animation: pulse 1.5s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body class="bg-slate-50">
    <div class="min-h-screen">
        <header class="bg-white shadow-sm border-b">
            <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8">
                <div class="flex justify-between items-center flex-wrap gap-3">
                    <div>
                        <h1 class="text-2xl font-bold text-slate-900">Controle de Discursos Públicos</h1>
                        <p class="text-sm text-slate-600 mt-1">Congregação São Mateus do Sul</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <span id="userEmail" class="text-sm text-slate-600"></span>
                        <button id="loginBtn" onclick="openLoginModal()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm font-medium">Entrar</button>
                        <button id="logoutBtn" onclick="logout()" class="hidden px-4 py-2 bg-slate-200 text-slate-700 rounded-lg hover:bg-slate-300 text-sm font-medium">Sair</button>
                    </div>
                </div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8">
            <div class="bg-white rounded-lg shadow-sm p-4 mb-6">
                <div class="flex flex-wrap gap-2 mb-4">
                    <button id="tab-visitantes" onclick="switchTab('visitantes')" class="tab-btn px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium">Oradores Visitantes</button>
                    <button id="tab-enviados" onclick="switchTab('enviados')" class="tab-btn px-4 py-2 bg-slate-200 text-slate-700 rounded-lg text-sm font-medium">Oradores Enviados</button>
                    <button id="tab-temas" onclick="switchTab('temas')" class="tab-btn px-4 py-2 bg-slate-200 text-slate-700 rounded-lg text-sm font-medium">Controle de Temas</button>
                    <button id="tab-oradores" onclick="switchTab('oradores')" class="tab-btn px-4 py-2 bg-slate-200 text-slate-700 rounded-lg text-sm font-medium">Oradores Samas Temas</button>
                </div>
                
                <!-- Filtros Avançados -->
                <div class="grid grid-cols-1 md:grid-cols-4 gap-3 mb-4">
                    <div class="flex gap-2">
                        <button id="prevMonth" onclick="navegarMes(-1)" class="btn-month px-3 py-2 bg-slate-200 rounded-lg hover:bg-slate-300 text-sm font-medium">◀ Mês Ant.</button>
                        <button id="currentMonthBtn" onclick="resetarMes()" class="btn-month px-3 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium flex-1">📅 Mês Atual</button>
                        <button id="nextMonth" onclick="navegarMes(1)" class="btn-month px-3 py-2 bg-slate-200 rounded-lg hover:bg-slate-300 text-sm font-medium">Mês Seg. ▶</button>
                    </div>
                    <div>
                        <select id="mesFiltro" onchange="mudarMesSelecionado()" class="w-full px-3 py-2 border rounded-lg text-sm">
                            <option value="">Selecione um mês...</option>
                        </select>
                    </div>
                    <div>
                        <select id="ordenacao" onchange="ordenarDados()" class="w-full px-3 py-2 border rounded-lg text-sm">
                            <option value="desc">📅 Mais recentes primeiro</option>
                            <option value="asc">📅 Mais antigos primeiro</option>
                        </select>
                    </div>
                    <div class="flex gap-2">
                        <input type="text" id="searchInput" onkeyup="searchTable()" placeholder="Buscar..." class="flex-1 px-3 py-2 border rounded-lg text-sm">
                        <button id="addBtn" onclick="openModal()" class="hidden px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 text-sm font-medium whitespace-nowrap">+ Adicionar</button>
                    </div>
                </div>
                
                <!-- Status e botão de limpeza -->
                <div class="flex justify-between items-center">
                    <div id="statusInfo" class="text-sm text-slate-500"></div>
                    <button onclick="removerDuplicatas()" class="text-red-600 hover:text-red-800 text-sm font-medium flex items-center gap-1">
                        🧹 Remover Duplicatas
                    </button>
                </div>
            </div>

            <!-- Tabelas (mesma estrutura do original) -->
            <div id="content-visitantes" class="tab-content bg-white rounded-lg shadow-sm overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead class="bg-slate-100 border-b">
                            <tr><th class="px-4 py-3 text-left text-sm font-semibold">Data</th><th class="px-4 py-3 text-left text-sm font-semibold">Orador</th><th class="px-4 py-3 text-left text-sm font-semibold">Congregação</th><th class="px-4 py-3 text-left text-sm font-semibold">Tema</th><th class="px-4 py-3 text-left text-sm font-semibold">Obs</th><th class="px-4 py-3 text-right text-sm font-semibold">Ações</th></tr>
                        </thead>
                        <tbody id="tbody-visitantes"></tbody>
                    </table>
                </div>
            </div>
            <div id="content-enviados" class="tab-content bg-white rounded-lg shadow-sm overflow-hidden hidden">
                <div class="overflow-x-auto">
                    <table class="w-full"><thead class="bg-slate-100 border-b"><tr><th class="px-4 py-3 text-left">Data</th><th class="px-4 py-3 text-left">Orador</th><th class="px-4 py-3 text-left">Congregação</th><th class="px-4 py-3 text-left">Tema</th><th class="px-4 py-3 text-left">Obs</th><th class="px-4 py-3 text-right">Ações</th></tr></thead><tbody id="tbody-enviados"></tbody></table>
                </div>
            </div>
            <div id="content-temas" class="tab-content bg-white rounded-lg shadow-sm overflow-hidden hidden">
                <div class="overflow-x-auto">
                    <table class="w-full"><thead class="bg-slate-100 border-b"><tr><th class="px-4 py-3 text-left">Número</th><th class="px-4 py-3 text-left">Título</th><th class="px-4 py-3 text-center">Usos</th><th class="px-4 py-3 text-left">Obs</th><th class="px-4 py-3 text-right">Ações</th></tr></thead><tbody id="tbody-temas"></tbody></table>
                </div>
            </div>
            <div id="content-oradores" class="tab-content bg-white rounded-lg shadow-sm overflow-hidden hidden">
                <div class="overflow-x-auto">
                    <table class="w-full"><thead class="bg-slate-100 border-b"><tr><th class="px-4 py-3 text-left">Nome</th><th class="px-4 py-3 text-left">Temas</th><th class="px-4 py-3 text-left">Obs</th><th class="px-4 py-3 text-right">Ações</th></tr></thead><tbody id="tbody-oradores"></tbody></table>
                </div>
            </div>
        </main>
    </div>

    <!-- Modais (mesmo do original) -->
    <div id="loginModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50"><div class="bg-white rounded-lg max-w-md w-full p-6"><h2 class="text-xl font-bold mb-4">Entrar</h2><div class="space-y-4"><div><label class="block text-sm font-medium mb-1">Email</label><input type="email" id="loginEmail" class="w-full px-4 py-3 border rounded-lg"></div><div><label class="block text-sm font-medium mb-1">Senha</label><input type="password" id="loginPassword" class="w-full px-4 py-3 border rounded-lg"></div><div class="flex gap-2 pt-2"><button onclick="login()" class="flex-1 px-4 py-3 bg-blue-600 text-white rounded-lg">Entrar</button><button onclick="closeModal('loginModal')" class="px-4 py-3 bg-slate-200 rounded-lg">Cancelar</button></div></div></div></div>

    <div id="formModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50 overflow-y-auto"><div class="bg-white rounded-lg max-w-2xl w-full p-6 my-8"><h2 id="modalTitle" class="text-xl font-bold mb-4">Adicionar</h2><form id="itemForm" onsubmit="saveItem(event)" class="space-y-4"><div id="formFields" class="space-y-4"></div><div class="flex gap-2 pt-4 border-t"><button type="submit" class="flex-1 px-4 py-3 bg-blue-600 text-white rounded-lg">Salvar</button><button type="button" onclick="closeModal('formModal')" class="px-4 py-3 bg-slate-200 rounded-lg">Cancelar</button></div></form></div></div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, onSnapshot, query, orderBy, where, writeBatch } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';

        const firebaseConfig = { apiKey: "AIzaSyDITvwMh4u-IA9gNht1WTlX6jxUBPj7c0I", authDomain: "discursos-6903f.firebaseapp.com", projectId: "discursos-6903f", storageBucket: "discursos-6903f.firebasestorage.app", messagingSenderId: "729085489214", appId: "1:729085489214:web:c8b617657d9af0fd31616f" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let currentUser = null, currentTab = 'visitantes', editId = null, unsubscribeSnapshot = null;
        let dadosOriginais = [], dadosFiltrados = [], mesAtual = new Date(), ordenacaoAtual = 'desc';
        const collections = { visitantes: 'visitantes', enviados: 'enviados', temas: 'temas', oradores: 'oradoresLocais' };

        onAuthStateChanged(auth, (user) => { currentUser = user; updateUI(); if (user) loadData(); else clearTables(); });

        function updateUI() {
            const loginBtn = document.getElementById('loginBtn'), logoutBtn = document.getElementById('logoutBtn'), addBtn = document.getElementById('addBtn');
            if (currentUser) { loginBtn?.classList.add('hidden'); logoutBtn?.classList.remove('hidden'); addBtn?.classList.remove('hidden'); document.getElementById('userEmail').textContent = currentUser.email; }
            else { loginBtn?.classList.remove('hidden'); logoutBtn?.classList.add('hidden'); addBtn?.classList.add('hidden'); document.getElementById('userEmail').textContent = ''; }
        }

        function clearTables() { ['visitantes', 'enviados', 'temas', 'oradores'].forEach(tab => { const tbody = document.getElementById(`tbody-${tab}`); if(tbody) tbody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-slate-500">Faça login para visualizar</td></tr>`; }); }

        window.login = async () => { try { await signInWithEmailAndPassword(auth, document.getElementById('loginEmail').value, document.getElementById('loginPassword').value); closeModal('loginModal'); } catch(error) { alert('Erro: ' + error.message); } };
        window.logout = async () => { await signOut(auth); if(unsubscribeSnapshot) unsubscribeSnapshot(); };
        window.closeModal = (id) => document.getElementById(id).classList.add('hidden');
        window.openLoginModal = () => document.getElementById('loginModal').classList.remove('hidden');

        function loadData() {
            if(!currentUser) return;
            if(unsubscribeSnapshot) unsubscribeSnapshot();
            const colName = collections[currentTab];
            const q = query(collection(db, colName));
            unsubscribeSnapshot = onSnapshot(q, (snapshot) => {
                dadosOriginais = [];
                snapshot.forEach(doc => dadosOriginais.push({ id: doc.id, ...doc.data() }));
                filtrarPorMes();
                atualizarStatusInfo();
            });
        }

        function atualizarStatusInfo() { document.getElementById('statusInfo').innerHTML = `📊 Total: ${dadosOriginais.length} registros | 📅 Mostrando: ${dadosFiltrados.length} registros`; }

        function filtrarPorMes() {
            if(currentTab === 'temas' || currentTab === 'oradores') { dadosFiltrados = [...dadosOriginais]; ordenarDados(); return; }
            const ano = mesAtual.getFullYear(), mes = mesAtual.getMonth() + 1;
            dadosFiltrados = dadosOriginais.filter(item => {
                if(!item.data) return false;
                const [anoItem, mesItem] = item.data.split('-');
                return parseInt(anoItem) === ano && parseInt(mesItem) === mes;
            });
            ordenarDados();
            document.getElementById('statusInfo').innerHTML = `📅 ${mes.toString().padStart(2,'0')}/${ano} | ${dadosFiltrados.length} discursos`;
        }

        window.navegarMes = (delta) => { mesAtual.setMonth(mesAtual.getMonth() + delta); filtrarPorMes(); };
        window.resetarMes = () => { mesAtual = new Date(); filtrarPorMes(); };
        window.mudarMesSelecionado = () => { alert('Função disponível na próxima atualização'); };

        window.ordenarDados = () => {
            ordenacaoAtual = document.getElementById('ordenacao').value;
            dadosFiltrados.sort((a,b) => {
                if(!a.data) return 1; if(!b.data) return -1;
                return ordenacaoAtual === 'desc' ? b.data.localeCompare(a.data) : a.data.localeCompare(b.data);
            });
            renderTable(dadosFiltrados);
        };

        window.switchTab = (tab) => {
            currentTab = tab; mesAtual = new Date();
            document.querySelectorAll('.tab-btn').forEach(btn => { btn.classList.remove('bg-blue-600','text-white'); btn.classList.add('bg-slate-200','text-slate-700'); });
            document.getElementById(`tab-${tab}`).classList.remove('bg-slate-200','text-slate-700'); document.getElementById(`tab-${tab}`).classList.add('bg-blue-600','text-white');
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden')); document.getElementById(`content-${tab}`).classList.remove('hidden');
            if(currentUser) loadData();
        };

        function renderTable(data) {
            const tbody = document.getElementById(`tbody-${currentTab}`);
            if(!tbody) return;
            tbody.innerHTML = '';
            if(data.length === 0) { tbody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-slate-500">Nenhum registro encontrado</td></tr>`; return; }
            data.forEach(item => { const tr = document.createElement('tr'); tr.className = 'border-b hover:bg-slate-50';
                let cells = '';
                if(currentTab === 'visitantes' || currentTab === 'enviados') cells = `<td class="px-4 py-3">${formatDate(item.data)}</td><td class="px-4 py-3 font-medium">${escapeHtml(item.orador || '')}</td><td class="px-4 py-3">${escapeHtml(item.congregacao || '')}</td><td class="px-4 py-3">${escapeHtml(item.tema || '')}</td><td class="px-4 py-3 text-sm">${escapeHtml(item.obs || '')}</td>`;
                else if(currentTab === 'temas') cells = `<td class="px-4 py-3 font-medium">${escapeHtml(item.numero || '')}</td><td class="px-4 py-3">${escapeHtml(item.titulo || '')}</td><td class="px-4 py-3 text-center"><span class="bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-sm font-semibold">${item.usos || 0}</span></td><td class="px-4 py-3 text-sm">${escapeHtml(item.obs || '')}</td>`;
                else if(currentTab === 'oradores') cells = `<td class="px-4 py-3 font-medium">${escapeHtml(item.nome || '')}</td><td class="px-4 py-3 text-sm">${escapeHtml(Array.isArray(item.temas) ? item.temas.join(', ') : item.temas || '')}</td><td class="px-4 py-3 text-sm">${escapeHtml(item.obs || '')}</td>`;
                const actions = currentUser ? `<td class="px-4 py-3 text-right"><button onclick="editItem('${item.id}')" class="text-blue-600 hover:text-blue-800 mr-3 text-sm">Editar</button><button onclick="deleteItem('${item.id}')" class="text-red-600 hover:text-red-800 text-sm">Excluir</button></td>` : '<td class="px-4 py-3"></td>';
                tr.innerHTML = cells + actions; tbody.appendChild(tr);
            });
        }

        window.removerDuplicatas = async () => {
            if(!confirm(`⚠️ Isso irá remover TODOS os registros duplicados (mesma data + mesmo orador + mesmo tema) da coleção "${currentTab}".\n\nDeseja continuar?`)) return;
            const mapa = new Map();
            const duplicados = [];
            for(const item of dadosOriginais) {
                const chave = `${item.data}|${item.orador}|${item.tema}`;
                if(mapa.has(chave)) duplicados.push(item.id);
                else mapa.set(chave, item.id);
            }
            if(duplicados.length === 0) { alert('Nenhuma duplicata encontrada!'); return; }
            if(confirm(`Encontradas ${duplicados.length} duplicatas. Remover?`)) {
                const batch = writeBatch(db);
                duplicados.forEach(id => batch.delete(doc(db, collections[currentTab], id)));
                await batch.commit();
                alert(`✅ ${duplicados.length} duplicatas removidas!`);
            }
        };

        window.searchTable = () => { const filtro = document.getElementById('searchInput').value.toLowerCase(); const rows = document.querySelectorAll(`#tbody-${currentTab} tr`); rows.forEach(row => { row.style.display = row.textContent.toLowerCase().includes(filtro) ? '' : 'none'; }); };
        function formatDate(dateStr) { if(!dateStr) return ''; const [y,m,d] = dateStr.split('-'); return `${d}/${m}/${y}`; }
        function escapeHtml(t) { if(!t) return ''; const div = document.createElement('div'); div.textContent = t; return div.innerHTML; }

        window.openModal = () => { editId = null; document.getElementById('modalTitle').textContent = `Adicionar`; document.getElementById('formModal').classList.remove('hidden'); renderForm(); };
        window.editItem = async (id) => { editId = id; const item = dadosOriginais.find(i => i.id === id); if(item) { document.getElementById('modalTitle').textContent = `Editar`; document.getElementById('formModal').classList.remove('hidden'); renderForm(); setTimeout(() => { Object.keys(item).forEach(key => { const el = document.getElementById(key); if(el) el.value = key === 'temas' && Array.isArray(item[key]) ? item[key].join(', ') : item[key]; }); }, 50); } };
        window.deleteItem = async (id) => { if(confirm('Excluir?')) await deleteDoc(doc(db, collections[currentTab], id)); };
        window.saveItem = async (e) => { e.preventDefault(); const formData = new FormData(e.target); const data = {}; for(let [k,v] of formData.entries()) data[k] = v; try { if(editId) await updateDoc(doc(db, collections[currentTab], editId), data); else await addDoc(collection(db, collections[currentTab]), data); closeModal('formModal'); } catch(error) { alert('Erro: ' + error.message); } };
        function renderForm() { const formFields = document.getElementById('formFields'); let html = ''; if(currentTab === 'visitantes' || currentTab === 'enviados') html = `<div><label>Data</label><input type="date" id="data" name="data" required class="w-full px-3 py-2 border rounded-lg"></div><div><label>Orador</label><input type="text" id="orador" name="orador" required class="w-full px-3 py-2 border rounded-lg"></div><div><label>Congregação</label><input type="text" id="congregacao" name="congregacao" required class="w-full px-3 py-2 border rounded-lg"></div><div><label>Nº Tema</label><input type="text" id="temaNumero" name="temaNumero" class="w-full px-3 py-2 border rounded-lg"></div><div><label>Tema</label><input type="text" id="tema" name="tema" required class="w-full px-3 py-2 border rounded-lg"></div><div><label>Obs</label><textarea id="obs" name="obs" rows="2" class="w-full px-3 py-2 border rounded-lg"></textarea></div>`;
        else if(currentTab === 'temas') html = `<div><label>Número</label><input type="text" id="numero" name="numero" required class="w-full px-3 py-2 border rounded-lg"></div><div><label>Título</label><input type="text" id="titulo" name="titulo" required class="w-full px-3 py-2 border rounded-lg"></div><div><label>Obs</label><textarea id="obs" name="obs" rows="2" class="w-full px-3 py-2 border rounded-lg"></textarea></div>`;
        else if(currentTab === 'oradores') html = `<div><label>Nome</label><input type="text" id="nome" name="nome" required class="w-full px-3 py-2 border rounded-lg"></div><div><label>Temas</label><input type="text" id="temas" name="temas" class="w-full px-3 py-2 border rounded-lg" placeholder="Ex: 12, 45, 78"></div><div><label>Obs</label><textarea id="obs" name="obs" rows="2" class="w-full px-3 py-2 border rounded-lg"></textarea></div>`;
        formFields.innerHTML = html; }
    </script>
</body>
</html>
