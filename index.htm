<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Discursos Públicos - Samas</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50">
    <div class="min-h-screen">
        <header class="bg-white shadow-sm border-b">
            <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8">
                <div class="flex justify-between items-center">
                    <div>
                        <h1 class="text-2xl font-bold text-slate-900">Controle de Discursos Públicos</h1>
                        <p class="text-sm text-slate-600 mt-1">Congregação São Mateus do Sul</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <span id="userEmail" class="text-sm text-slate-600"></span>
                        <button id="loginBtn" onclick="openLoginModal()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm font-medium">Entrar</button>
                        <button id="logoutBtn" onclick="logout()" class="hidden px-4 py-2 bg-slate-200 text-slate-700 rounded-lg hover:bg-slate-300 text-sm font-medium">Sair</button>
                    </div>
                </div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8">
            <div class="bg-white rounded-lg shadow-sm p-4 mb-6">
                <div class="flex flex-wrap gap-2 mb-4">
                    <button id="tab-visitantes" onclick="switchTab('visitantes')" class="tab-btn px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium">Oradores Visitantes</button>
                    <button id="tab-enviados" onclick="switchTab('enviados')" class="tab-btn px-4 py-2 bg-slate-200 text-slate-700 rounded-lg text-sm font-medium">Oradores Enviados</button>
                    <button id="tab-temas" onclick="switchTab('temas')" class="tab-btn px-4 py-2 bg-slate-200 text-slate-700 rounded-lg text-sm font-medium">Controle de Temas</button>
                    <button id="tab-oradores" onclick="switchTab('oradores')" class="tab-btn px-4 py-2 bg-slate-200 text-slate-700 rounded-lg text-sm font-medium">Oradores Samas Temas</button>
                </div>
                
                <!-- Filtros que mudam conforme a aba -->
                <div id="filtrosVisitantes" class="grid grid-cols-1 md:grid-cols-4 gap-3 mb-4">
                    <div class="flex gap-2">
                        <button onclick="navegarMes(-1)" class="px-3 py-2 bg-slate-200 rounded-lg hover:bg-slate-300 text-sm font-medium">◀ Mês Ant.</button>
                        <button onclick="resetarMes()" class="px-3 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium flex-1">📅 Mês Atual</button>
                        <button onclick="navegarMes(1)" class="px-3 py-2 bg-slate-200 rounded-lg hover:bg-slate-300 text-sm font-medium">Mês Seg. ▶</button>
                    </div>
                    <div>
                        <select id="ordenacao" onchange="ordenarDados()" class="w-full px-3 py-2 border rounded-lg text-sm">
                            <option value="asc">📅 Data (crescente)</option>
                            <option value="desc">📅 Data (decrescente)</option>
                        </select>
                    </div>
                    <div><input type="text" id="searchInput" onkeyup="searchTable()" placeholder="Buscar..." class="w-full px-3 py-2 border rounded-lg text-sm"></div>
                    <div><button id="addBtn" onclick="openModal()" class="hidden w-full px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 text-sm font-medium">+ Adicionar</button></div>
                </div>

                <!-- Filtros ESPECÍFICOS para a aba de Temas -->
                <div id="filtrosTemas" class="hidden grid grid-cols-1 md:grid-cols-4 gap-3 mb-4">
                    <div>
                        <label class="text-xs text-slate-500 block mb-1">Ordenar Temas por</label>
                        <select id="ordenacaoTemas" onchange="ordenarTemas()" class="w-full px-3 py-2 border rounded-lg text-sm">
                            <option value="numeroAsc">🔢 Número (1 ao 197)</option>
                            <option value="numeroDesc">🔢 Número (197 ao 1)</option>
                            <option value="maisUsados">📊 Mais usados primeiro</option>
                            <option value="menosUsados">📊 Menos usados primeiro</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs text-slate-500 block mb-1">Filtrar por uso</label>
                        <select id="filtroUsoTemas" onchange="ordenarTemas()" class="w-full px-3 py-2 border rounded-lg text-sm">
                            <option value="todos">📋 Todos os temas</option>
                            <option value="nuncaUsados">🆕 Nunca usados (0 vezes)</option>
                            <option value="poucoUsados">⚠️ Pouco usados (1-2 vezes)</option>
                            <option value="muitoUsados">🔥 Muito usados (3+ vezes)</option>
                        </select>
                    </div>
                    <div><input type="text" id="searchTemas" onkeyup="filtrarTemas()" placeholder="Buscar por número ou título..." class="w-full px-3 py-2 border rounded-lg text-sm"></div>
                    <div><button onclick="exportarTemas()" class="w-full px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 text-sm font-medium">📎 Exportar Temas</button></div>
                </div>
                
                <div class="flex justify-between items-center">
                    <div id="statusInfo" class="text-sm text-slate-500"></div>
                    <button onclick="removerDuplicatas()" class="text-red-600 hover:text-red-800 text-sm">🧹 Remover Duplicatas</button>
                </div>
            </div>

            <div id="content-visitantes" class="tab-content bg-white rounded-lg shadow-sm overflow-hidden">
                <div class="overflow-x-auto"><table class="w-full"><thead class="bg-slate-100 border-b"><tr><th>Data/Horário</th><th>Orador</th><th>Congregação</th><th>Tema</th><th>Obs</th><th>Ações</th></tr></thead><tbody id="tbody-visitantes"></tbody></table></div>
            </div>

            <div id="content-enviados" class="tab-content bg-white rounded-lg shadow-sm overflow-hidden hidden">
                <div class="overflow-x-auto"><table class="w-full"><thead class="bg-slate-100 border-b"><tr><th>Data/Horário</th><th>Orador</th><th>Congregação</th><th>Tema</th><th>Obs</th><th>Ações</th></tr></thead><tbody id="tbody-enviados"></tbody></table></div>
            </div>

            <div id="content-temas" class="tab-content bg-white rounded-lg shadow-sm overflow-hidden hidden">
                <div class="overflow-x-auto"><table class="w-full"><thead class="bg-slate-100 border-b"><tr><th class="px-4 py-3 text-left">Nº</th><th class="px-4 py-3 text-left">Título do Tema</th><th class="px-4 py-3 text-center">Usos</th><th class="px-4 py-3 text-left">Obs</th><th class="px-4 py-3 text-right">Ações</th></tr></thead><tbody id="tbody-temas"></tbody></table></div>
            </div>

            <div id="content-oradores" class="tab-content bg-white rounded-lg shadow-sm overflow-hidden hidden">
                <div class="overflow-x-auto"><table class="w-full"><thead class="bg-slate-100 border-b"><tr><th>Nome</th><th>Temas</th><th>Obs</th><th>Ações</th></tr></thead><tbody id="tbody-oradores"></tbody></table></div>
            </div>
        </main>
    </div>

    <!-- Modais -->
    <div id="loginModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50"><div class="bg-white rounded-lg max-w-md w-full p-6"><h2 class="text-xl font-bold mb-4">Entrar</h2><div><input type="email" id="loginEmail" placeholder="Email" class="w-full border rounded-lg p-2 mb-3"><input type="password" id="loginPassword" placeholder="Senha" class="w-full border rounded-lg p-2 mb-3"><button onclick="login()" class="w-full bg-blue-600 text-white py-2 rounded-lg">Entrar</button><button onclick="closeModal('loginModal')" class="w-full mt-2 bg-slate-200 py-2 rounded-lg">Cancelar</button></div></div></div>

    <div id="formModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50"><div class="bg-white rounded-lg max-w-2xl w-full p-6"><h2 id="modalTitle" class="text-xl font-bold mb-4">Adicionar</h2><form id="itemForm" onsubmit="saveItem(event)"><div id="formFields"></div><div class="flex gap-2 mt-4"><button type="submit" class="flex-1 bg-blue-600 text-white py-2 rounded-lg">Salvar</button><button type="button" onclick="closeModal('formModal')" class="flex-1 bg-slate-200 py-2 rounded-lg">Cancelar</button></div></form></div></div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, onSnapshot, query, writeBatch } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';

        const firebaseConfig = { apiKey: "AIzaSyDITvwMh4u-IA9gNht1WTlX6jxUBPj7c0I", authDomain: "discursos-6903f.firebaseapp.com", projectId: "discursos-6903f", storageBucket: "discursos-6903f.firebasestorage.app", messagingSenderId: "729085489214", appId: "1:729085489214:web:c8b617657d9af0fd31616f" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let currentUser = null, currentTab = 'visitantes', editId = null, unsubscribeSnapshot = null;
        let dadosOriginais = [], dadosFiltrados = [], mesAtual = new Date();
        const collections = { visitantes: 'visitantes', enviados: 'enviados', temas: 'temas', oradores: 'oradoresLocais' };

        onAuthStateChanged(auth, (user) => { currentUser = user; updateUI(); if (user) loadData(); });

        function updateUI() {
            document.getElementById('loginBtn').classList.toggle('hidden', currentUser);
            document.getElementById('logoutBtn').classList.toggle('hidden', !currentUser);
            document.getElementById('addBtn').classList.toggle('hidden', !currentUser);
            if(currentUser) document.getElementById('userEmail').textContent = currentUser.email;
        }

        window.login = async () => { try { await signInWithEmailAndPassword(auth, document.getElementById('loginEmail').value, document.getElementById('loginPassword').value); closeModal('loginModal'); } catch(e) { alert('Erro: '+e.message); } };
        window.logout = async () => { await signOut(auth); if(unsubscribeSnapshot) unsubscribeSnapshot(); };
        window.closeModal = (id) => document.getElementById(id).classList.add('hidden');
        window.openLoginModal = () => document.getElementById('loginModal').classList.remove('hidden');

        function loadData() {
            if(!currentUser) return;
            if(unsubscribeSnapshot) unsubscribeSnapshot();
            unsubscribeSnapshot = onSnapshot(collection(db, collections[currentTab]), (snapshot) => {
                dadosOriginais = [];
                snapshot.forEach(doc => dadosOriginais.push({ id: doc.id, ...doc.data() }));
                if(currentTab === 'temas') {
                    carregarUsosTemas();
                } else {
                    filtrarPorMes();
                }
            });
        }

        async function carregarUsosTemas() {
            // Buscar usos reais dos visitantes e enviados
            const visitantesSnap = await getDocs(collection(db, 'visitantes'));
            const enviadosSnap = await getDocs(collection(db, 'enviados'));
            const contagem = {};
            visitantesSnap.forEach(doc => { const num = doc.data().temaNumero; if(num) contagem[num] = (contagem[num] || 0) + 1; });
            enviadosSnap.forEach(doc => { const num = doc.data().temaNumero; if(num) contagem[num] = (contagem[num] || 0) + 1; });
            
            for(const tema of dadosOriginais) {
                const usos = contagem[tema.numero] || 0;
                if(tema.usos !== usos && tema.id) await updateDoc(doc(db, 'temas', tema.id), { usos });
                tema.usos = usos;
            }
            ordenarTemas();
        }

        function ordenarTemas() {
            const ordem = document.getElementById('ordenacaoTemas').value;
            const filtroUso = document.getElementById('filtroUsoTemas').value;
            
            let temas = [...dadosOriginais];
            
            // Aplicar filtro de uso
            if(filtroUso === 'nuncaUsados') temas = temas.filter(t => (t.usos || 0) === 0);
            else if(filtroUso === 'poucoUsados') temas = temas.filter(t => (t.usos || 0) >= 1 && (t.usos || 0) <= 2);
            else if(filtroUso === 'muitoUsados') temas = temas.filter(t => (t.usos || 0) >= 3);
            
            // Ordenar
            if(ordem === 'numeroAsc') temas.sort((a,b) => (parseInt(a.numero)||0) - (parseInt(b.numero)||0));
            else if(ordem === 'numeroDesc') temas.sort((a,b) => (parseInt(b.numero)||0) - (parseInt(a.numero)||0));
            else if(ordem === 'maisUsados') temas.sort((a,b) => (b.usos||0) - (a.usos||0));
            else if(ordem === 'menosUsados') temas.sort((a,b) => (a.usos||0) - (b.usos||0));
            
            dadosFiltrados = temas;
            renderTemas();
            atualizarStatusTemas();
        }

        function renderTemas() {
            const tbody = document.getElementById('tbody-temas');
            if(!tbody) return;
            tbody.innerHTML = '';
            
            const busca = document.getElementById('searchTemas')?.value.toLowerCase() || '';
            let filtrados = dadosFiltrados;
            if(busca) {
                filtrados = dadosFiltrados.filter(t => 
                    t.numero?.toString().includes(busca) || 
                    t.titulo?.toLowerCase().includes(busca)
                );
            }
            
            if(filtrados.length === 0) { tbody.innerHTML = `<tr><td colspan="5" class="text-center py-8 text-slate-500">Nenhum tema encontrado</td></tr>`; return; }
            
            filtrados.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = 'border-b hover:bg-slate-50';
                let corUsos = '';
                if(item.usos === 0) corUsos = 'bg-gray-100 text-gray-600';
                else if(item.usos <= 2) corUsos = 'bg-yellow-100 text-yellow-800';
                else corUsos = 'bg-green-100 text-green-800';
                
                tr.innerHTML = `
                    <td class="px-4 py-3 font-medium">${item.numero || ''}</td>
                    <td class="px-4 py-3">${escapeHtml(item.titulo || '')}</td>
                    <td class="px-4 py-3 text-center"><span class="${corUsos} px-3 py-1 rounded-full text-sm font-semibold">${item.usos || 0} uso${item.usos !== 1 ? 's' : ''}</span></td>
                    <td class="px-4 py-3 text-sm">${escapeHtml(item.obs || '')}</td>
                    <td class="px-4 py-3 text-right">${currentUser ? `<button onclick="editItem('${item.id}')" class="text-blue-600 hover:text-blue-800 mr-3 text-sm">Editar</button><button onclick="deleteItem('${item.id}')" class="text-red-600 hover:text-red-800 text-sm">Excluir</button>` : ''}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function atualizarStatusTemas() {
            const total = dadosOriginais.length;
            const usados = dadosOriginais.filter(t => (t.usos || 0) > 0).length;
            const nuncaUsados = total - usados;
            const totalUsos = dadosOriginais.reduce((sum, t) => sum + (t.usos || 0), 0);
            document.getElementById('statusInfo').innerHTML = `📊 ${total} temas | ${usados} usados | ${nuncaUsados} nunca usados | ${totalUsos} discursos no total`;
        }

        window.filtrarTemas = () => { renderTemas(); };

        window.exportarTemas = () => {
            let csv = "Número,Título,Usos,Observações\n";
            dadosOriginais.sort((a,b) => (parseInt(a.numero)||0) - (parseInt(b.numero)||0));
            dadosOriginais.forEach(t => {
                csv += `"${t.numero || ''}","${(t.titulo || '').replace(/"/g, '""')}",${t.usos || 0},"${(t.obs || '').replace(/"/g, '""')}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `temas_${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
        };

        function parseDataCompleta(dataStr) {
            if(!dataStr) return new Date(0);
            let dataLimpa = dataStr.toString();
            if(dataLimpa.includes('/')) {
                let partes = dataLimpa.split(' ');
                let dataPartes = partes[0].split('/');
                let horaPartes = partes[1] ? partes[1].split(':') : [0,0];
                return new Date(parseInt(dataPartes[2]), parseInt(dataPartes[1])-1, parseInt(dataPartes[0]), parseInt(horaPartes[0])||0, parseInt(horaPartes[1])||0);
            } else {
                return new Date(dataLimpa);
            }
        }

        function filtrarPorMes() {
            if(currentTab === 'temas') return;
            const ano = mesAtual.getFullYear(), mes = mesAtual.getMonth() + 1;
            dadosFiltrados = dadosOriginais.filter(item => {
                if(!item.data) return false;
                let dataObj = parseDataCompleta(item.data);
                return dataObj.getFullYear() === ano && (dataObj.getMonth() + 1) === mes;
            });
            ordenarDados();
            document.getElementById('statusInfo').innerHTML = `📅 ${mes.toString().padStart(2,'0')}/${ano} | ${dadosFiltrados.length} discursos`;
        }

        window.ordenarDados = () => {
            if(currentTab === 'temas') return;
            let ordem = document.getElementById('ordenacao').value;
            dadosFiltrados.sort((a,b) => {
                if(!a.data) return 1; if(!b.data) return -1;
                let dataA = parseDataCompleta(a.data);
                let dataB = parseDataCompleta(b.data);
                return ordem === 'asc' ? dataA - dataB : dataB - dataA;
            });
            renderTable();
        };

        function renderTable() {
            const tbody = document.getElementById(`tbody-${currentTab}`);
            if(!tbody || currentTab === 'temas') return;
            tbody.innerHTML = '';
            if(dadosFiltrados.length === 0) { tbody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-slate-500">Nenhum registro encontrado</td></tr>`; return; }
            
            dadosFiltrados.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = 'border-b hover:bg-slate-50';
                let cells = '';
                if(currentTab === 'visitantes' || currentTab === 'enviados') {
                    cells = `<td class="px-4 py-3">${formatarDataExibicao(item.data)}</td><td class="px-4 py-3 font-medium">${escapeHtml(item.orador || '')}</td><td class="px-4 py-3">${escapeHtml(item.congregacao || '')}</td><td class="px-4 py-3">${escapeHtml(item.tema || '')}</td><td class="px-4 py-3 text-sm">${escapeHtml(item.obs || '')}</td>`;
                } else if(currentTab === 'oradores') {
                    cells = `<td class="px-4 py-3 font-medium">${escapeHtml(item.nome || '')}</td><td class="px-4 py-3 text-sm">${escapeHtml(Array.isArray(item.temas) ? item.temas.join(', ') : item.temas || '')}</td><td class="px-4 py-3 text-sm">${escapeHtml(item.obs || '')}</td>`;
                }
                const actions = currentUser ? `<td class="px-4 py-3 text-right"><button onclick="editItem('${item.id}')" class="text-blue-600 hover:text-blue-800 mr-3 text-sm">Editar</button><button onclick="deleteItem('${item.id}')" class="text-red-600 hover:text-red-800 text-sm">Excluir</button></td>` : '<td class="px-4 py-3"></td>';
                tr.innerHTML = cells + actions;
                tbody.appendChild(tr);
            });
        }

        window.navegarMes = (delta) => { mesAtual.setMonth(mesAtual.getMonth() + delta); filtrarPorMes(); };
        window.resetarMes = () => { mesAtual = new Date(); filtrarPorMes(); };

        function formatarDataExibicao(dataStr) {
            if(!dataStr) return '';
            if(dataStr.includes('/')) return dataStr;
            let data = new Date(dataStr);
            return data.toLocaleDateString('pt-BR');
        }

        window.removerDuplicatas = async () => {
            if(!confirm('Remover duplicatas (mesma data+orador+tema)?')) return;
            const mapa = new Map();
            const duplicados = [];
            for(const item of dadosOriginais) {
                const chave = `${item.data}|${item.orador}|${item.tema}`;
                if(mapa.has(chave)) duplicados.push(item.id);
                else mapa.set(chave, item.id);
            }
            if(duplicados.length === 0) { alert('Nenhuma duplicata!'); return; }
            const batch = writeBatch(db);
            duplicados.forEach(id => batch.delete(doc(db, collections[currentTab], id)));
            await batch.commit();
            alert(`✅ ${duplicados.length} duplicatas removidas!`);
        };

        window.searchTable = () => {
            const filtro = document.getElementById('searchInput').value.toLowerCase();
            const rows = document.querySelectorAll(`#tbody-${currentTab} tr`);
            rows.forEach(row => { row.style.display = row.textContent.toLowerCase().includes(filtro) ? '' : 'none'; });
        };

        function escapeHtml(t) { if(!t) return ''; const div = document.createElement('div'); div.textContent = t; return div.innerHTML; }

        window.switchTab = (tab) => {
            currentTab = tab;
            mesAtual = new Date();
            
            // Mostrar/esconder filtros específicos
            document.getElementById('filtrosVisitantes').classList.toggle('hidden', tab === 'temas');
            document.getElementById('filtrosTemas').classList.toggle('hidden', tab !== 'temas');
            
            document.querySelectorAll('.tab-btn').forEach(btn => { btn.classList.remove('bg-blue-600','text-white'); btn.classList.add('bg-slate-200','text-slate-700'); });
            document.getElementById(`tab-${tab}`).classList.remove('bg-slate-200','text-slate-700'); document.getElementById(`tab-${tab}`).classList.add('bg-blue-600','text-white');
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden')); document.getElementById(`content-${tab}`).classList.remove('hidden');
            if(currentUser) loadData();
        };

        window.openModal = () => { editId = null; document.getElementById('modalTitle').textContent = `Adicionar`; document.getElementById('formModal').classList.remove('hidden'); renderForm(); };
        
        window.editItem = async (id) => { editId = id; const item = dadosOriginais.find(i => i.id === id); if(item) { document.getElementById('modalTitle').textContent = `Editar`; document.getElementById('formModal').classList.remove('hidden'); renderForm(); setTimeout(() => { Object.keys(item).forEach(key => { const el = document.getElementById(key); if(el) el.value = item[key]; }); }, 50); } };
        
        window.deleteItem = async (id) => { if(confirm('Excluir?')) await deleteDoc(doc(db, collections[currentTab], id)); };
        
        window.saveItem = async (e) => { e.preventDefault(); const formData = new FormData(e.target); const data = {}; for(let [k,v] of formData.entries()) data[k] = v; try { if(editId) await updateDoc(doc(db, collections[currentTab], editId), data); else await addDoc(collection(db, collections[currentTab]), data); closeModal('formModal'); } catch(error) { alert('Erro: ' + error.message); } };
        
        function renderForm() {
            const formFields = document.getElementById('formFields');
            let html = '';
            if(currentTab === 'visitantes' || currentTab === 'enviados') {
                html = `<div><label>Data e Horário</label><input type="datetime-local" id="data" name="data" class="w-full px-3 py-2 border rounded-lg"></div>
                        <div><label>Orador</label><input type="text" id="orador" name="orador" required class="w-full px-3 py-2 border rounded-lg"></div>
                        <div><label>Congregação</label><input type="text" id="congregacao" name="congregacao" class="w-full px-3 py-2 border rounded-lg"></div>
                        <div><label>Nº do Tema</label><input type="text" id="temaNumero" name="temaNumero" class="w-full px-3 py-2 border rounded-lg"></div>
                        <div><label>Tema</label><input type="text" id="tema" name="tema" class="w-full px-3 py-2 border rounded-lg"></div>
                        <div><label>Observações</label><textarea id="obs" name="obs" rows="2" class="w-full px-3 py-2 border rounded-lg"></textarea></div>`;
            } else if(currentTab === 'temas') {
                html = `<div><label>Número</label><input type="number" id="numero" name="numero" required class="w-full px-3 py-2 border rounded-lg"></div>
                        <div><label>Título</label><input type="text" id="titulo" name="titulo" required class="w-full px-3 py-2 border rounded-lg"></div>
                        <div><label>Observações</label><textarea id="obs" name="obs" rows="2" class="w-full px-3 py-2 border rounded-lg"></textarea></div>`;
            } else if(currentTab === 'oradores') {
                html = `<div><label>Nome</label><input type="text" id="nome" name="nome" required class="w-full px-3 py-2 border rounded-lg"></div>
                        <div><label>Temas (separados por vírgula)</label><input type="text" id="temas" name="temas" class="w-full px-3 py-2 border rounded-lg" placeholder="Ex: 12, 45, 78"></div>
                        <div><label>Observações</label><textarea id="obs" name="obs" rows="2" class="w-full px-3 py-2 border rounded-lg"></textarea></div>`;
            }
            formFields.innerHTML = html;
        }
    </script>
</body>
