<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Importar Oradores Visitantes</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-8">
    <div class="max-w-4xl mx-auto">
        <div class="bg-white rounded-lg shadow-sm p-6">
            <h1 class="text-2xl font-bold mb-4">📥 Importar Oradores Visitantes</h1>
            <textarea id="dados" rows="15" class="w-full border rounded-lg p-3 font-mono text-sm mb-4" placeholder="Cole os dados limpos aqui..."></textarea>
            <button onclick="importar()" class="bg-green-600 text-white px-6 py-2 rounded-lg">🚀 Importar</button>
            <div id="resultado" class="mt-4 hidden"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { getFirestore, collection, addDoc, getDocs, writeBatch, query, where } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';
        import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
        
        const firebaseConfig = {
            apiKey: "AIzaSyDITvwMh4u-IA9gNht1WTlX6jxUBPj7c0I",
            authDomain: "discursos-6903f.firebaseapp.com",
            projectId: "discursos-6903f",
            storageBucket: "discursos-6903f.firebasestorage.app",
            messagingSenderId: "729085489214",
            appId: "1:729085489214:web:c8b617657d9af0fd31616f"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        let usuarioLogado = false;
        
        onAuthStateChanged(auth, (user) => {
            usuarioLogado = !!user;
            if(!user) alert('⚠️ Faça login no sistema principal primeiro!');
        });
        
        window.importar = async () => {
            if(!usuarioLogado) { alert('Faça login primeiro!'); return; }
            
            const texto = document.getElementById('dados').value;
            if(!texto.trim()) { alert('Cole os dados!'); return; }
            
            const linhas = texto.split('\n').filter(l => l.trim());
            if(linhas.length < 2) { alert('Dados insuficientes'); return; }
            
            const dados = [];
            for(let i = 1; i < linhas.length; i++) {
                const valores = linhas[i].split('\t');
                if(valores.length < 4) continue;
                
                let data = valores[0]?.trim();
                let dataFormatada = data;
                if(data && data.includes('/') && !data.includes(' ')) {
                    const partes = data.split('/');
                    if(partes.length === 3) {
                        dataFormatada = `${partes[2]}-${partes[1].padStart(2,'0')}-${partes[0].padStart(2,'0')}`;
                    }
                }
                
                dados.push({
                    data: dataFormatada,
                    temaNumero: valores[1]?.trim() || '',
                    tema: valores[2]?.trim() || '',
                    orador: valores[3]?.trim() || '',
                    congregacao: valores[4]?.trim() || '',
                    obs: valores[5]?.trim() || ''
                });
            }
            
            if(dados.length === 0) { alert('Nenhum dado válido'); return; }
            
            let sucessos = 0;
            for(const item of dados) {
                if(!item.orador) continue;
                try {
                    await addDoc(collection(db, 'visitantes'), item);
                    sucessos++;
                } catch(e) { console.error(e); }
            }
            
            document.getElementById('resultado').innerHTML = `<div class="bg-green-100 p-3 rounded-lg">✅ ${sucessos} registros importados!</div>`;
            document.getElementById('resultado').classList.remove('hidden');
            alert(`${sucessos} Oradores Visitantes importados! Atualize o sistema principal.`);
        };
    </script>
</body>
</html>
